services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      PORT: "3000"
      MONGODB_URI: "mongodb://mongo:27017/duelrush"
      MONGO_TIMEOUT_MS: "2000"
    ports:
      - "3000:3000"
    depends_on:
      - mongo

volumes:
  mongo_data:

